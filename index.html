<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Phone Remote</title>
<style>
/* ---------- Design tokens (light + dark) ---------- */
:root{
  --bg:#e7eaee; --panel:#f6f7f9; --ink:#22262b; --muted:#6a727c; --line:#d3d8de;
  --key:#ffffff; --key-shadow:#b9c0c9; --accent:#2f5bea; --ok:#1f9d7a; --err:#d6453d;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161c27; --panel:#1e2635; --ink:#e8ecf2; --muted:#93a0b3; --line:#2f3a4e;
    --key:#28334a; --key-shadow:#0d121b; --accent:#6f93ff; --ok:#3cc9a0; --err:#ff7a70;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- PIN gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:24px;display:grid;gap:12px}
.card h1,.card h2{margin:0;font-size:1.3rem}
.card p{margin:0;color:var(--muted);font-size:.92rem}

/* ---------- Layout ---------- */
.wrap{max-width:860px;margin:0 auto;padding:16px}
header.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header.bar h1{font-size:1.25rem;margin:0;flex:1}
.badge{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--panel);
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.err{color:var(--err);border-color:var(--err)}
section.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:14px}
section.group h2{font-size:1rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}

/* ---------- Controls ---------- */
input[type=text],input[type=password],input[type=url]{width:100%;padding:11px 12px;
  border-radius:10px;border:1px solid var(--line);background:var(--key)}
label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.btn,.key{cursor:pointer;border:1px solid var(--line);background:var(--key);border-radius:12px;
  padding:12px 8px;box-shadow:0 3px 0 var(--key-shadow);transition:transform .06s,box-shadow .06s;
  touch-action:manipulation}
.key{display:grid;justify-items:center;gap:2px;min-height:72px;align-content:center}
.key .ico{font-size:1.4rem;line-height:1}
.key .lbl{font-size:.88rem}
.btn:active,.key:active{transform:translateY(3px);box-shadow:0 0 0 var(--key-shadow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ghost{box-shadow:none;padding:8px 12px}
.key.busy,.btn.busy{opacity:.55;pointer-events:none}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:10px}
.err-msg{color:var(--err);font-size:.88rem;min-height:1.2em}

/* ---------- Settings dialog + toast ---------- */
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  color:var(--ink);width:min(92vw,440px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:grid;gap:12px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;
  pointer-events:none;transition:.2s;max-width:90vw;text-align:center;font-size:.92rem}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--ok);color:#fff}
#toast.err{background:var(--err);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ============ PIN GATE (setup on first run, unlock afterwards) ============ -->
<main class="gate" id="gate">
  <form class="card" id="gateForm" autocomplete="off">
    <h1 id="gateTitle">Unlock remote</h1>
    <p id="gateHint">Enter your PIN.</p>
    <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required minlength="4">
    <input type="password" id="pin2" inputmode="numeric" placeholder="Repeat PIN" hidden minlength="4">
    <div class="err-msg" id="gateErr" role="alert"></div>
    <button class="btn primary" id="gateBtn" type="submit">Unlock</button>
  </form>
</main>

<!-- ============ DASHBOARD ============ -->
<div class="wrap" id="app" hidden>
  <header class="bar">
    <h1>Phone Remote</h1>
    <span class="badge" id="status">Ready</span>
    <button class="btn ghost" id="openSettings" type="button" aria-label="Settings">⚙ Settings</button>
    <button class="btn ghost" id="lockBtn" type="button" aria-label="Lock">🔒 Lock</button>
  </header>

  <!-- Button groups are generated from the COMMANDS table in the script -->
  <div id="groups"></div>

  <section class="group">
    <h2>Speak text</h2>
    <div class="row">
      <label>Text the phone will read aloud
        <input type="text" id="speakText" maxlength="500" placeholder="Hello from the dashboard"></label>
      <button class="btn primary" id="speakBtn" type="button">Speak text</button>
    </div>
    <h2>Paste text</h2>
    <div class="row" style="margin-bottom:0">
      <label>Text to copy to the phone clipboard
        <input type="text" id="clipText" maxlength="1000" placeholder="Text to paste"></label>
      <button class="btn primary" id="clipBtn" type="button">Paste text</button>
    </div>
  </section>
</div>

<!-- ============ SETTINGS ============ -->
<dialog id="settings">
  <form method="dialog" id="settingsForm" autocomplete="off">
    <h2 style="margin:0">Settings</h2>
    <label>Base webhook URL
      <input type="url" id="baseUrl" placeholder="https://trigger.macrodroid.com/YOUR-DEVICE-ID" required></label>
    <label>Secret token
      <input type="password" id="token" placeholder="Same value your macros check" required></label>
    <label>New PIN (leave empty to keep current)
      <input type="password" id="newPin" inputmode="numeric" minlength="4"></label>
    <div class="err-msg" id="setErr" role="alert"></div>
    <div class="actions">
      <button class="btn ghost" type="button" id="wipeBtn">Erase saved data</button>
      <button class="btn ghost" type="button" id="closeSettings">Cancel</button>
      <button class="btn primary" type="submit">Save settings</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ==========================================================================
   Phone Remote – MacroDroid webhook dashboard (no dependencies, no build step)

   How requests are built:   <base URL>/<command id>?token=<secret>[&text=...]
   Nothing private lives in this file. The base URL + token are typed into the
   Settings panel and stored in localStorage ENCRYPTED with a key derived from
   your PIN (PBKDF2 → AES-GCM via the Web Crypto API; needs HTTPS or localhost).
   ========================================================================== */

/* ---------- 1. Command table: edit ids/labels here to match your macros ---------- */
const COMMANDS = [
  { title: "Device controls", items: [
    { id: "flashlight",  icon: "🔦", label: "Flashlight" },
    { id: "alarm_start", icon: "⏰", label: "Alarm on" },
    { id: "alarm_stop",  icon: "🔕", label: "Alarm off" },
    { id: "volume_max",  icon: "🔊", label: "Volume max" },
    { id: "volume_mute", icon: "🔇", label: "Mute" },
    { id: "lock_screen", icon: "🔒", label: "Lock screen" },
    { id: "dim_screen",  icon: "🌙", label: "Dim screen" },
    { id: "dnd",         icon: "⛔", label: "Do not disturb" } ]},
  { title: "Connectivity", items: [
    { id: "wifi",      icon: "📶", label: "Wi-Fi" },
    { id: "bluetooth", icon: "🔵", label: "Bluetooth" },
    { id: "hotspot",   icon: "📡", label: "Hotspot" } ]},
  { title: "Navigation & actions", items: [
    { id: "back",       icon: "◀", label: "Back" },
    { id: "home",       icon: "⌂", label: "Home" },
    { id: "recents",    icon: "▢", label: "Recent apps" },
    { id: "take_photo", icon: "📷", label: "Take photo" } ]}
];
const TEXT_COMMANDS = { speak: "speak_text", clipboard: "paste_text" }; // ids for the two text macros
const REQUEST_TIMEOUT_MS = 8000;
const AUTO_LOCK_MS = 5 * 60 * 1000;    // lock after 5 idle minutes
const MAX_TRIES = 5, LOCK_SECONDS = 30; // PIN brute-force slowdown
const KDF_ITERATIONS = 200000;
const STORE_KEY = "phoneRemote.vault.v1";
const TRIES_KEY = "phoneRemote.tries.v1";

/* ---------- 2. Tiny helpers ---------- */
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

let cryptoKey = null;                       // lives in memory only, cleared on lock
let settings = { url: "", token: "" };      // decrypted settings, memory only
let idleTimer = null;

/* ---------- 3. Crypto: PIN → key, encrypt/decrypt the vault ---------- */
async function deriveKey(pin, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: KDF_ITERATIONS, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function saveVault(key, salt) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key,
    enc.encode(JSON.stringify({ check: "ok", ...settings })));
  localStorage.setItem(STORE_KEY, JSON.stringify({ salt: b64(salt), iv: b64(iv), data: b64(data) }));
}
async function openVault(pin) {             // throws if PIN is wrong (AES-GCM auth fails)
  const v = JSON.parse(localStorage.getItem(STORE_KEY));
  const salt = unb64(v.salt);
  const key = await deriveKey(pin, salt);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(v.iv) }, key, unb64(v.data));
  const obj = JSON.parse(dec.decode(plain));
  if (obj.check !== "ok") throw new Error("bad");
  return { key, salt, obj };
}
let currentSalt = null;

/* ---------- 4. PIN gate ---------- */
const hasVault = () => !!localStorage.getItem(STORE_KEY);

function showGate() {
  const first = !hasVault();
  $("gate").hidden = false; $("app").hidden = true;
  $("gateTitle").textContent = first ? "Create a PIN" : "Unlock remote";
  $("gateHint").textContent = first
    ? "Choose a PIN of at least 4 digits. It also encrypts your saved URL and token on this device."
    : "Enter your PIN.";
  $("pin2").hidden = !first; $("pin2").required = first;
  $("gateBtn").textContent = first ? "Create PIN" : "Unlock";
  $("pin").value = $("pin2").value = ""; $("gateErr").textContent = "";
  $("pin").focus();
}

function lockedOutSeconds() {
  const t = JSON.parse(localStorage.getItem(TRIES_KEY) || "{}");
  return t.until && t.until > Date.now() ? Math.ceil((t.until - Date.now()) / 1000) : 0;
}
function registerFailure() {
  const t = JSON.parse(localStorage.getItem(TRIES_KEY) || "{}");
  t.count = (t.count || 0) + 1;
  if (t.count >= MAX_TRIES) { t.until = Date.now() + LOCK_SECONDS * 1000; t.count = 0; }
  localStorage.setItem(TRIES_KEY, JSON.stringify(t));
}

$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pin = $("pin").value, err = $("gateErr");
  try {
    if (!hasVault()) {                       // first run: create the vault
      if (pin.length < 4) return (err.textContent = "Use at least 4 characters.");
      if (pin !== $("pin2").value) return (err.textContent = "PINs don't match.");
      currentSalt = crypto.getRandomValues(new Uint8Array(16));
      cryptoKey = await deriveKey(pin, currentSalt);
      settings = { url: "", token: "" };
      await saveVault(cryptoKey, currentSalt);
    } else {                                 // later runs: unlock
      const wait = lockedOutSeconds();
      if (wait) return (err.textContent = `Too many tries. Wait ${wait}s.`);
      try {
        const { key, salt, obj } = await openVault(pin);
        cryptoKey = key; currentSalt = salt; settings = { url: obj.url || "", token: obj.token || "" };
        localStorage.removeItem(TRIES_KEY);
      } catch { registerFailure(); return (err.textContent = "Wrong PIN."); }
    }
  } catch (ex) {
    return (err.textContent = "Encryption isn't available here. Open the page over HTTPS.");
  }
  showApp();
});

/* ---------- 5. Dashboard ---------- */
function showApp() {
  $("gate").hidden = true; $("app").hidden = false;
  buildButtons(); resetIdle();
  if (!settings.url || !settings.token) { setStatus("Add URL & token in Settings", "err"); $("settings").showModal(); fillSettings(); }
  else setStatus("Ready");
}
function lock() {
  cryptoKey = null; settings = { url: "", token: "" }; clearTimeout(idleTimer);
  if ($("settings").open) $("settings").close();
  showGate();
}
function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(lock, AUTO_LOCK_MS); }
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, () => cryptoKey && resetIdle()));
$("lockBtn").onclick = lock;

function buildButtons() {                    // generate sections + keys from COMMANDS
  const root = $("groups"); root.innerHTML = "";
  COMMANDS.forEach((g) => {
    const sec = document.createElement("section"); sec.className = "group";
    sec.innerHTML = `<h2></h2><div class="grid"></div>`;
    sec.querySelector("h2").textContent = g.title;
    g.items.forEach((it) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "key";
      b.innerHTML = `<span class="ico" aria-hidden="true"></span><span class="lbl"></span>`;
      b.querySelector(".ico").textContent = it.icon;
      b.querySelector(".lbl").textContent = it.label;
      b.onclick = () => send(it.id, {}, b, it.label);
      sec.querySelector(".grid").appendChild(b);
    });
    root.appendChild(sec);
  });
}
$("speakBtn").onclick = () => sendText("speak", $("speakText"), $("speakBtn"), "Speak text");
$("clipBtn").onclick  = () => sendText("clipboard", $("clipText"), $("clipBtn"), "Paste text");
["speakText", "clipText"].forEach((id) => $(id).addEventListener("keydown", (e) => {
  if (e.key === "Enter") $(id === "speakText" ? "speakBtn" : "clipBtn").click();
}));
function sendText(kind, input, btn, label) {
  const v = input.value.trim();
  if (!v) return toast("Type some text first.", "err");
  send(TEXT_COMMANDS[kind], { text: v }, btn, label);
}

/* ---------- 6. Sending the webhook ---------- */
async function send(command, params, btn, label) {
  if (!settings.url || !settings.token) { toast("Add your URL and token in Settings.", "err"); return; }
  // URL is assembled here at runtime from locally stored settings only.
  const url = new URL(`${settings.url.replace(/\/+$/, "")}/${encodeURIComponent(command)}`);
  url.searchParams.set("token", settings.token);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  btn.classList.add("busy"); setStatus("Sending…");
  try {
    // MacroDroid doesn't send CORS headers, so use no-cors: the request goes out but the
    // response is opaque. "Sent" means it left your browser, not that the macro ran.
    await fetch(url, { method: "GET", mode: "no-cors", cache: "no-store",
                       referrerPolicy: "no-referrer", signal: ctrl.signal });
    toast(`${label} sent`, "ok"); setStatus(`Sent: ${label}`, "ok");
  } catch (e) {
    const msg = e.name === "AbortError" ? "Timed out" : "Couldn't reach the server";
    toast(`${label} failed: ${msg}`, "err"); setStatus("Failed", "err");
  } finally { clearTimeout(timer); btn.classList.remove("busy"); }
}

/* ---------- 7. Settings ---------- */
function fillSettings() {
  $("baseUrl").value = settings.url; $("token").value = settings.token;
  $("newPin").value = ""; $("setErr").textContent = "";
}
$("openSettings").onclick = () => { fillSettings(); $("settings").showModal(); };
$("closeSettings").onclick = () => $("settings").close();
$("settingsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("baseUrl").value.trim(), token = $("token").value.trim();
  if (!/^https:\/\//i.test(url)) return ($("setErr").textContent = "The URL must start with https://");
  settings = { url, token };
  try {
    const np = $("newPin").value;
    if (np) {                                // changing PIN: new salt + new key
      if (np.length < 4) return ($("setErr").textContent = "Use at least 4 characters.");
      currentSalt = crypto.getRandomValues(new Uint8Array(16));
      cryptoKey = await deriveKey(np, currentSalt);
    }
    await saveVault(cryptoKey, currentSalt);
    $("settings").close(); setStatus("Settings saved", "ok"); toast("Settings saved", "ok");
  } catch { $("setErr").textContent = "Couldn't save. Try again."; }
});
$("wipeBtn").onclick = () => {
  if (!confirm("Erase the saved URL, token and PIN from this browser?")) return;
  localStorage.removeItem(STORE_KEY); localStorage.removeItem(TRIES_KEY); lock();
};

/* ---------- 8. Feedback UI ---------- */
function setStatus(text, kind = "") { const s = $("status"); s.textContent = text; s.className = "badge " + kind; }
let toastTimer;
function toast(msg, kind = "") {
  const t = $("toast"); t.textContent = msg; t.className = "show " + kind;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ""), 2600);
}

/* ---------- 9. Start ---------- */
showGate();
</script>
</body>
</html>
